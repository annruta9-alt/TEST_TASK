ServerName localhost
Timeout 300

# Python environment for mod_wsgi: the venv built in the Dockerfile
WSGIDaemonProcess video processes=2 threads=4 user=www-data group=www-data \
    home=/app python-home=/opt/venv python-path=/app
WSGIProcessGroup video
WSGIApplicationGroup %{GLOBAL}
WSGIImportScript /app/app.wsgi process-group=video application-group=%{GLOBAL}

<VirtualHost *:80>
    ServerName localhost

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Uploaded videos are served by Apache itself (static files, Range requests).
    # Must come BEFORE WSGIScriptAlias.
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        # never expose temporary upload files
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Everything else goes to the Flask application
    WSGIScriptAlias / /app/app.wsgi
    <Directory /app>
        <Files app.wsgi>
            Require all granted
        </Files>
    </Directory>
</VirtualHost>
